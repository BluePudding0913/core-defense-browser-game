<!doctype html>
<html lang="ja" class="comfort-frame-enabled"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白い枠 / プレビュー</title><link rel="stylesheet" href="../comfort-frame.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#141e26;color:#e3e9e5;font:13px system-ui,sans-serif;overflow:hidden}#lab-scene{position:fixed;inset:0;width:100%;height:100%}header,footer{position:fixed;left:30px;right:30px;z-index:1;display:flex;justify-content:space-between;align-items:center}header{top:25px}h1{font-size:20px;font-weight:450}button,a{font:inherit;color:#d8e1dd;background:#243033;border:1px solid #65726e;border-radius:3px;padding:9px 14px;text-decoration:none;cursor:pointer}footer{bottom:25px;color:#b3c1ba;font-size:11px}#overlay{display:none}.labels{position:fixed;left:0;right:0;bottom:20%;z-index:1;display:flex;justify-content:space-evenly;pointer-events:none;letter-spacing:.15em}
.reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font:24px system-ui;pointer-events:none;z-index:1}header,footer{z-index:6}h1{text-shadow:0 1px 4px #0009}footer{color:#fff;text-shadow:0 1px 3px #000;background:#101820b8;padding:8px 12px;border-radius:3px}button[aria-pressed="true"]{border-color:#fff;color:#fff}@media(max-width:600px){header,footer{left:16px;right:16px}header{align-items:flex-start;gap:8px}h1{font-size:15px}button{padding:8px}footer{font-size:10px;gap:20px}}</style></head><body><header><h1>画面酔い対策</h1><div><button id="frame" aria-pressed="true">白い枠：オン</button> <button id="walk" aria-pressed="false">視点を動かす</button> <button id="light">停電</button></div></header><span class="reticle" aria-hidden="true">×</span><footer><span id="status">通常照明</span><span>プレビューはオンで表示・ゲームの初期値はオフ</span></footer><canvas id="overlay"></canvas><div class="comfort-frame" aria-hidden="true"></div>
<script src="../vendor/three.min.js"></script><script src="../aim-control.js"></script><script src="../soldier-model.js"></script><script src="../sniper-stance.js"></script><script src="../organic-enemy-models.js"></script><script src="../lab-enemy-models.js"></script><script src="../wall-impacts.js"></script><script src="../block-terrain.js"></script><script src="../map-object-models.js"></script><script src="../hit-presentation.js"></script><script src="../lab3d.js"></script>
<script>
'use strict';
const overlay=document.querySelector('#overlay'),lab=Lab3D.create(overlay),rows=['#########',...Array(7).fill('#.......#'),'#########'],reachable=new Set();
for(let y=1;y<8;y++)for(let x=1;x<8;x++)reachable.add(y+':'+x);
const state={core:{x:60,y:60},players:[],enemies:['tiny','gilded','blueAce'].map((type,i)=>({id:i,type,x:140+i*40,y:145,hp:100,maxHp:100,facingX:0,facingY:1})),slots:[],resources:[],drops:[],blackoutActive:false};
let walking=false,last=null,travel=0;
document.querySelector("#frame").onclick=e=>{const enabled=document.documentElement.classList.toggle("comfort-frame-enabled");e.target.setAttribute("aria-pressed",String(enabled));e.target.textContent=enabled?"白い枠：オン":"白い枠：オフ";};
document.querySelector('#walk').onclick=e=>{walking=!walking;e.target.setAttribute('aria-pressed',String(walking));e.target.textContent=walking?'視点を止める':'視点を動かす';};
document.querySelector('#light').onclick=e=>{state.blackoutActive=!state.blackoutActive;e.target.textContent=state.blackoutActive?'通常照明':'停電';document.querySelector('#status').textContent=state.blackoutActive?'停電中':'通常照明';};
function draw(ms){
 requestAnimationFrame(draw);const dt=last===null?0:Math.min(.1,(ms-last)/1000);last=ms;if(walking)travel+=dt*28;
 overlay.width=innerWidth;overlay.height=innerHeight;
 
 lab.render({map:{tileSize:40,rows},reachable,center:{x:180,y:240},eye:{x:180,y:240},view:{yaw:Math.sin(travel/65)*.35,pitch:-.12},scale:1,state,localId:null,smooth:(_,p)=>p,radius:e=>e.type==='tiny'?10:21,stations:[],effects:[]});
}
requestAnimationFrame(draw);
window.previewReady=true;
</script></body></html>
