<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呼吸の照準 / 試作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10191c;color:#e8eeee;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:25px;left:30px;pointer-events:none}h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#9caeb0}nav{position:absolute;bottom:25px;left:30px;right:30px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #61777a;background:#253639;color:#e8eeee;border-radius:5px;padding:10px 18px;cursor:pointer}label{margin-left:auto;color:#a8b6b8;cursor:pointer}#feedback{position:absolute;left:50%;top:72%;transform:translateX(-50%);min-height:25px;font-size:18px;pointer-events:none}#debug{position:absolute;top:26px;right:30px;color:#bac8bb;text-align:right;line-height:1.9;white-space:pre-line}</style>
<canvas id="view"></canvas><header><h1>呼吸の照準 / 試作</h1><p>クリック・Spaceで射撃</p></header><div id="feedback" aria-live="polite"></div><div id="debug" hidden></div>
<nav><button id="shoot">撃つ</button><button id="pause">一時停止</button><button id="reset">やり直す</button><label><input type="checkbox" id="hint"> 確認用の情報</label></nav>
<script src="sniper-breathing.js"></script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),feedback=document.getElementById('feedback'),debug=document.getElementById('debug');
let model=createBreathingPreview(),elapsed=0,last=performance.now(),paused=false,feedbackUntil=0,flashUntil=0;
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);}resize();addEventListener('resize',resize);
function shoot(){const b=model.sample(elapsed);feedback.textContent=b.perfect?'精密射撃':b.precision?'タイミングが外れた':'通常射撃';feedback.style.color=b.perfect?'#e5d19b':'#dae2e3';feedbackUntil=performance.now()+650;flashUntil=performance.now()+90;}
canvas.onclick=shoot;document.getElementById('shoot').onclick=shoot;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再開':'一時停止';};
document.getElementById('reset').onclick=()=>{model=createBreathingPreview();elapsed=0;feedback.textContent='';};
document.getElementById('hint').onchange=e=>debug.hidden=!e.target.checked;
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target.tagName!=='INPUT'){e.preventDefault();shoot();}});
function draw(now){if(!paused)elapsed+=Math.min(now-last,100);last=now;
const w=innerWidth,h=innerHeight,x=w/2,y=h/2,scope=Math.min(w*.40,h*.39),b=model.sample(elapsed);
ctx.fillStyle='#0c1215';ctx.fillRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.arc(x,y,scope,0,Math.PI*2);ctx.clip();
const background=ctx.createLinearGradient(0,y-scope,0,y+scope);background.addColorStop(0,'#5c6a6b');background.addColorStop(.6,'#424f50');background.addColorStop(1,'#293638');ctx.fillStyle=background;ctx.fillRect(x-scope,y-scope,scope*2,scope*2);
// A quiet lab corridor keeps the subtle change readable against an actual scene.
ctx.strokeStyle='#788485';ctx.lineWidth=1;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(x+side*scope,y-scope);ctx.lineTo(x+side*90,y+85);ctx.lineTo(x+side*scope,y+scope);ctx.stroke();}
ctx.fillStyle='#303d3e';ctx.fillRect(x-90,y-110,180,195);ctx.strokeStyle='#566567';ctx.strokeRect(x-90,y-110,180,195);
ctx.fillStyle='#83908a';ctx.beginPath();ctx.ellipse(x,y,10,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#65756d';ctx.fillRect(x-17,y+12,34,43);ctx.fillStyle='#425252';ctx.fillRect(x-14,y+55,11,39);ctx.fillRect(x+3,y+55,11,39);
ctx.strokeStyle='rgba(15,22,23,.85)';ctx.lineWidth=1;ctx.beginPath();for(const side of [-1,1]){ctx.moveTo(x+side*78,y);ctx.lineTo(x+side*scope,y);ctx.moveTo(x,y+side*78);ctx.lineTo(x,y+side*scope);}ctx.stroke();
// Identical color and stroke for all cycles: the warning changes maximum radius only.
ctx.shadowColor='#101719';ctx.shadowBlur=2;ctx.strokeStyle='#e1e8e5';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,b.radius,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#e1e8e5';ctx.fillRect(x-.75,y-.75,1.5,1.5);
if(now<flashUntil){ctx.strokeStyle='#e7e0c6';ctx.lineWidth=1.5;ctx.beginPath();for(const [a,c]of [[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.moveTo(x+a*7,y+c*7);ctx.lineTo(x+a*12,y+c*12);}ctx.stroke();}
ctx.restore();ctx.strokeStyle='#263236';ctx.lineWidth=10;ctx.beginPath();ctx.arc(x,y,scope+5,0,Math.PI*2);ctx.stroke();
if(now>feedbackUntil)feedback.textContent='';if(!debug.hidden)debug.textContent=`呼吸 ${b.cycle+1}\n${b.precision?'特別な収縮':b.warning?'前兆：最大半径 +3%':'通常'}\n${b.perfect?'精密射撃の瞬間':''}`;
window.breathingPreviewState=b;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
