<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>HUNTER / BOMBER</title><style>body{margin:0;background:#191d20;color:#e6e5df;font:14px system-ui}header{padding:20px 30px;display:flex;justify-content:space-between}button{color:inherit;background:#303a40;border:1px solid #6c797f;border-radius:4px;padding:8px 16px;cursor:pointer}canvas{display:block;width:100%;height:auto}</style></head><body><header><span>HUNTER / BOMBER · 更新モデル</span><button id="save">画像を保存</button></header><canvas id="sheet"></canvas>
<script src="../vendor/three.min.js"></script><script src="../organic-enemy-models.js"></script><script>
'use strict';
const hunterOnly=new URLSearchParams(location.search).has('hunter');
const family=new URLSearchParams(location.search).has('family');
const T=THREE,sheet=document.querySelector('#sheet');sheet.width=hunterOnly?924:1800;sheet.height=1120;const ctx=sheet.getContext('2d');ctx.fillStyle='#191d20';ctx.fillRect(0,0,sheet.width,1120);
ctx.fillStyle='#e6e5df';ctx.font='500 36px system-ui';ctx.fillText(family?'HUNTER / CORE HUNTER':hunterOnly?'HUNTER / BLACK & RED':'HUNTER / BOMBER',32,54);ctx.fillStyle='#a1abad';ctx.font='18px system-ui';ctx.fillText(family?'共通デザイン · HUNTER：黒と赤 / CORE HUNTER：黒と金':hunterOnly?'黒い全身 · 赤い発光眼 · 深紅のマーキング':'黒と赤の追跡者 / 赤い爆薬と黄黒の警告帯',32,88);
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(2);r.setSize(418,850);r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;
const studio=new T.Scene();studio.background=new T.Color('#535e66').convertSRGBToLinear();for(const [x,y,z,w,h,color]of [[-3,3,2,2,5,'#e3e9e6'],[3,2,1,2,4,'#9aaeb7'],[0,4,-3,4,2,'#f4e7d1']]){const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color,side:T.DoubleSide}));p.position.set(x,y,z);p.lookAt(0,1,0);studio.add(p);}const pmrem=new T.PMREMGenerator(r),env=pmrem.fromScene(studio,.12);
for(const [i,id,angle,label]of (family?[[0,'lab-hunter',.15,'HUNTER / FRONT'],[1,'lab-hunter',Math.PI+.30,'HUNTER / BACK'],[2,'lab-corehunter',.15,'CORE HUNTER / FRONT'],[3,'lab-corehunter',Math.PI+.30,'CORE HUNTER / BACK']]:[[0,'lab-hunter',.15,'HUNTER / FRONT'],[1,'lab-hunter',Math.PI+.30,'HUNTER / BACK'],[2,'lab-bomber',.15,'BOMBER / FRONT'],[3,'lab-bomber',Math.PI+.30,'BOMBER / BACK']])){
 if(hunterOnly&&id!=='lab-hunter')continue;
 const s=new T.Scene();s.background=new T.Color('#20272b');s.environment=env.texture;s.add(new T.HemisphereLight('#c5d5dd','#33302b',.72));for(const [x,y,z,intensity,color]of [[-3,6,5,1.7,'#f4ecdb'],[4,3,2,.55,'#bad5e4'],[1,4,-4,1.3,'#d2e2df']]){const l=new T.DirectionalLight(color,intensity);l.position.set(x,y,z);s.add(l);}
 const m=buildOrganicEnemy(T,id);m.reset();m.root.rotation.y=angle;s.add(m.root);const camera=new T.PerspectiveCamera(32,418/850,.05,40);camera.position.set(0,1.03,3.55);camera.lookAt(0,.86,0);r.render(s,camera);const x=32+i*438;ctx.drawImage(r.domElement,x,130,418,850);ctx.fillStyle='#e6e5df';ctx.font='500 22px system-ui';ctx.fillText(label,x+14,1018);ctx.fillStyle='#a1abad';ctx.font='16px system-ui';ctx.fillText(id==='lab-corehunter'?'黒い全身 · 金の発光眼と模様':id==='lab-hunter'?'黒い全身 · 赤い発光眼と深紅の模様':'赤い爆薬束 · 警告帯 · 点灯表示',x+14,1050);m.dispose();
}
ctx.fillStyle='#a1abad';ctx.font='15px system-ui';ctx.fillText('Actual 3D models · Studio lighting · Rest pose',32,1100);r.dispose();env.dispose();pmrem.dispose();
document.querySelector('#save').onclick=()=>sheet.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=family?'hunter-family.png':hunterOnly?'hunter-black-red.png':'hunter-bomber.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></body></html>
