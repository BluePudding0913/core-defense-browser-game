<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory / Exit</title>
<link rel="stylesheet" href="../style.css">
<style>body{background:radial-gradient(ellipse at 65% 40%,#30414b,#0c141c)}.inventory-menu{background:transparent;backdrop-filter:none}.inventory-card{max-height:96vh}</style>
<script src="../weapon-ui.js"></script><script src="../job-ui.js"></script>
<script>
(async()=>{
 const [html,source]=await Promise.all(['../index.html','../app.js'].map(p=>fetch(p).then(r=>r.text())));
 const template=new DOMParser().parseFromString(html,'text/html');
 const inventory=template.querySelector('#inventory-menu');inventory.classList.remove('hidden');document.body.append(inventory,template.querySelector('#exit-dialog'));
 const me={job:'healer',weapon:'pistol',hp:100,maxHp:100,wood:18,ore:7,copper:2,silver:1,medkits:3,credits:700,buildItems:{}};
 const definitions={bat:{capacity:0},pistol:{capacity:0}};
 const a=source.indexOf('let equipmentOrder ='),b=source.indexOf('\nfunction selectEquipment',a);
 const ordering=new Function('getMe','BUILD_INFO','localStorage','WeaponUI','WEAPON_FIELDS',source.slice(a,b)+';return {equipmentEntries,reorderEquipment};')(()=>me,{}, {getItem:()=>null,setItem(){}},WeaponUI,definitions);
 const start=source.indexOf('function updateInventory(me) {'),end=source.indexOf('\nfunction toggleInventory()',start);
 new Function('inventoryItems','getMe','equipmentEntries','WEAPON_FIELDS','ammoForWeapon','selectEquipment','send','reorderEquipment','RESOURCE_NAMES','JOBS',source.slice(start,end)+';updateInventory(getMe());')(document.querySelector('#inventory-items'),()=>me,ordering.equipmentEntries,definitions,()=>0,()=>{},()=>{},ordering.reorderEquipment,{wood:'木材',ore:'鉄鉱石',copper:'銅',silver:'銀'},JobUI.catalog);
 const dialog=document.querySelector('#exit-dialog');document.querySelector('#leave-game').onclick=()=>{dialog.returnValue='cancel';dialog.showModal();};
 window.previewReady=true;
})().catch(e=>{document.body.textContent=e.stack;});
</script></html>
