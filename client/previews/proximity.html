<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敵の接近 / エフェクト比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141e26;color:#ecf2f0;font:13px system-ui,sans-serif;overflow:hidden}#lab-scene,#overlay{position:fixed;inset:0;width:100%;height:100%}#overlay{pointer-events:none;z-index:1}header{position:fixed;top:22px;left:26px;right:26px;z-index:3;display:flex;justify-content:space-between;align-items:start;gap:16px}h1{font-size:18px;font-weight:550;margin:0 0 6px}small{color:#b4c2bf;font-size:11px}.panel{background:#101c22eb;border:1px solid #6d82764d;border-radius:8px;padding:16px;backdrop-filter:blur(10px)}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;color:#d6e1dd;background:#263439;border:1px solid #536665;border-radius:4px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#435b58;border-color:#b4d5c5;color:#fff}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}footer{position:fixed;bottom:24px;left:26px;right:26px;z-index:3;display:flex;justify-content:space-between;align-items:end;gap:16px}.controls{width:350px;display:grid;gap:12px}label{display:grid;grid-template-columns:1fr auto;gap:6px}input{grid-column:1/-1;width:100%;accent-color:#c6d5c3}output{font-variant-numeric:tabular-nums;color:#f8d2bb}.actions{display:flex;gap:6px}.caption{max-width:300px;text-align:right;text-shadow:0 2px 4px #000}.caption strong{display:block;font-weight:500;font-size:15px;margin-bottom:6px}.reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;z-index:2;pointer-events:none;color:#fff9}.hud{position:fixed;left:26px;top:135px;z-index:2;letter-spacing:.1em;font-size:11px;color:#e4efdf;text-shadow:0 2px 4px #000}.hud div{margin-top:7px}.hp{width:120px;height:3px;background:#c3d4ad}.state{margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:0;color:#eebc9f}@media(max-width:650px){header{top:12px;left:12px;right:12px;flex-direction:column;gap:8px}.panel{padding:11px}h1{font-size:15px}button{padding:7px 9px;font-size:12px}footer{bottom:12px;left:12px;right:12px;align-items:stretch;flex-direction:column}.controls{width:min(100%,350px);gap:7px}.caption{font-size:11px;max-width:none;text-align:left}.caption strong{font-size:12px;margin-bottom:2px}.hud{top:170px;left:12px}}
</style></head><body>
<header><div class="panel"><h1>敵の接近</h1><small>エフェクト比較 / 検知範囲 5マス</small></div><nav class="panel" aria-label="エフェクト案"><button data-mode="edge" aria-pressed="true">A　画面端</button><button data-mode="arc" aria-pressed="false">B　方向アーク</button><button data-mode="ring" aria-pressed="false">C　警告リング</button><button data-mode="off" aria-pressed="false">なし</button></nav></header>
<div class="hud">PREVIEW / ROUND 08<div class="hp"></div><div>HP 100　　G 500000</div><div id="threat-state" class="state" role="status"></div></div>
<canvas id="overlay" aria-label="敵との距離に応じた警告エフェクト"></canvas><span class="reticle" aria-hidden="true">+</span>
<footer><div class="panel controls"><label for="distance">敵との距離<output id="distance-value">1.8 マス</output><input id="distance" type="range" min="35" max="280" value="72" step="1"></label><label for="direction">敵の方向<output id="direction-value">正面</output><input id="direction" type="range" min="-180" max="180" value="0" step="1"></label><div class="actions"><button id="auto" aria-pressed="false">接近を再生</button><button id="light" aria-pressed="false">停電</button></div></div><div class="caption"><strong id="name">A / 画面端の発光</strong><span id="description">近いほど赤く。中央の視界を広く残す。</span></div></footer>
<script src="../vendor/three.min.js"></script><script src="../aim-control.js"></script><script src="../soldier-model.js"></script><script src="../sniper-stance.js"></script><script src="../organic-enemy-models.js"></script><script src="../lab-enemy-models.js"></script><script src="../wall-impacts.js"></script><script src="../block-terrain.js"></script><script src="../map-object-models.js"></script><script src="../hit-presentation.js"></script><script src="../lab3d.js"></script><script src="../proximity-warning.js"></script><script src="proximity-effects.js"></script><script src="proximity.js"></script>
</body></html>
