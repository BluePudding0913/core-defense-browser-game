<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map objects</title>
<style>html,body{margin:0;background:#17232e;color:#e4edef;font:14px system-ui}header{padding:20px 28px;border-bottom:1px solid #394854}h1{font-size:20px;margin:0 0 6px}p{margin:0;color:#a9bbc6}main{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#394854}article{min-width:0;background:#1c2935;padding:12px}article canvas{width:100%;height:auto;display:block}h2{font-size:14px;margin:8px 4px 4px;font-weight:600}body.single header{display:none}body.single main{display:block}body.single article{padding:16px}body.single h2{text-align:center;font-size:20px}a{color:inherit;text-decoration:none}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style>
<header><h1>MAP OBJECTS</h1><p>施設・資源・防衛設備 / ゲームと共通の3Dモデル</p></header><main></main>
<script src="../vendor/three.min.js"></script><script src="../aim-control.js"></script><script src="../soldier-model.js"></script><script src="../sniper-stance.js"></script><script src="../zombie-model.js"></script><script src="../wall-impacts.js"></script><script src="../block-terrain.js"></script><script src="../map-object-models.js"></script><script src="../lab3d.js"></script><script>
const T=THREE, definitions=[
 ['medical','MED BAY / 医療ベッド'],['weapon','WEAPON / 武器ラック','rifle'],['sniper','SNIPER / 長銃ラック','sniper','weapon'],['heavy','HEAVY / 重火器ラック','rocket','weapon'],
 ['ammo','AMMO / 弾薬箱'],['workbench','WORKBENCH / 工具台'],['advanced','ADVANCED / 圧縮プレス'],['woodcutter','WOODCUTTER / 丸鋸'],
 ['quarry','QUARRY / 採掘ドリル'],['wood-factory','WOOD FACTORY / 木材製造','woodFactory','factory'],['ore-factory','ORE FACTORY / 鉄製造','oreFactory','factory'],['copper-factory','COPPER FACTORY / 銅製造','copperFactory','factory'],['silver-factory','SILVER FACTORY / 銀製造','silverFactory','factory'],
 ['command','SYSTEM / 操作卓'],['time','TIME / 時間制御'],['missile','MISSILE / 発射卓'],['job','JOB / 装備ロッカー'],['enchant','ULTIMATE / 武器強化'],['armor','ARMOR / 防具展示'],['gacha','GACHA / カプセル装置'],['team','TEAM / 通信ブースター'],
 ['wood','WOOD / 木材',null,'resource'],['ore','ORE / 鉄鉱石',null,'resource'],['copper','COPPER / 銅鉱石',null,'resource'],['silver','SILVER / 銀結晶',null,'resource'],['medkit','MEDKIT / 回復キット',null,'resource'],
 ['barricade','WOOD BARRICADE / 木材防壁',null,'defense'],['copperBarricade','COPPER BARRICADE / 銅防壁',null,'defense'],['silverBarricade','SILVER BARRICADE / 銀防壁',null,'defense']
];
// Build through Lab3D, so the gallery also verifies the production station routing.
let captured;const NativeRenderer=T.WebGLRenderer;
T.WebGLRenderer=class extends NativeRenderer {constructor(options){super(options);this.render=(scene,camera)=>{if(camera.near!==.01)captured=scene;};}};
const overlay=document.createElement('canvas');overlay.width=32;overlay.height=32;
const lab=Lab3D.create(overlay), fixture={core:{x:60,y:60},players:[],enemies:[],slots:[],resources:[],drops:[]},stations=[];
for(const [id,label,item,category] of definitions) {
 const point={id,x:100,y:100,item};
 if(category==='resource')fixture.resources.push({...point,type:id,available:true});
 else if(category==='defense')fixture.slots.push({...point,defense:{type:id}});
 else {const kind=category || id;stations.push([point,label,MapObjectModels.colors[kind],kind]);}
}
lab.render({map:{tileSize:40,rows:['#####','#...#','#...#','#...#','#####']},reachable:new Set(['1:1','1:2','1:3','2:1','2:2','2:3','3:1','3:2','3:3']),center:{x:100,y:100},scale:1,state:fixture,localId:null,smooth:(_,p)=>p,radius:()=>24,stations,aim:{x:100,y:100},effects:[]});
T.WebGLRenderer=NativeRenderer;
const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(480,400);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new T.Scene();scene.background=new T.Color('#1c2935');scene.add(new T.HemisphereLight(0xd4e9f5,0x44505a,1.1));
for(const [color,intensity,x,y,z] of [[0xffedcf,1.4,-50,100,90],[0xb9dcff,.9,80,65,-40]]){const l=new T.DirectionalLight(color,intensity);l.position.set(x,y,z);scene.add(l);}
const ground=new T.Mesh(new T.CylinderGeometry(27,28,2,48),new T.MeshStandardMaterial({color:'#344652',roughness:.9}));ground.position.y=-1;scene.add(ground);
const camera=new T.PerspectiveCamera(36,1.2,.1,500), single=new URLSearchParams(location.search).get('model');if(single)document.body.classList.add('single');
window.previewModels=[];
for(const [id,label,item,category] of definitions) {
 if(single && id!==single)continue;
 const prefix=category==='resource'?'resource:':category==='defense'?'defense:':'station:';
 const model=captured.children.find(o=>o.name.startsWith(prefix+id+':'));if(!model)throw Error('Missing '+id);
 model.position.set(0,0,0);model.rotation.set(0,0,0);model.visible=true;scene.add(model);scene.updateMatrixWorld(true);
 const bounds=new T.Box3().setFromObject(model),center=bounds.getCenter(new T.Vector3());
 camera.position.set(68,65,100);camera.lookAt(0,20,0);renderer.render(scene,camera);
 const article=document.createElement('article');article.id=id;const a=document.createElement('a');a.href='?model='+encodeURIComponent(id);
 const canvas=document.createElement('canvas');canvas.width=480;canvas.height=400;canvas.getContext('2d').drawImage(renderer.domElement,0,0);a.appendChild(canvas);
 const title=document.createElement('h2');title.textContent=label;a.appendChild(title);article.appendChild(a);document.querySelector('main').appendChild(article);
 let meshes=0;model.traverse(o=>{if(o.isMesh)meshes++;});window.previewModels.push({id,meshes,bounds:bounds.getSize(new T.Vector3()).toArray()});scene.remove(model);
}
window.previewReady=true;
</script></html>
