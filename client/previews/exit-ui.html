<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exit UI proposals</title>
<link rel="stylesheet" href="../style.css">
<style>
body { margin:0; overflow:auto; background:#090d11; color:#edf1f5; font-family:Arial,"Yu Gothic",sans-serif; }
main { padding:36px; }
header { display:flex; align-items:baseline; gap:20px; margin-bottom:28px; }
h1 { font-size:22px; margin:0; letter-spacing:.12em; }
header span { font-size:12px; color:#858e97; }
.options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
article h2 { margin:0 0 12px; font-size:16px; font-weight:500; }
article h2 b { color:#a5daef; margin-right:10px; }
.scene { height:480px; position:relative; display:grid; place-items:center; overflow:hidden; background:radial-gradient(ellipse at 65% 40%,#30414b 0%,#18242c 40%,#0c141c 85%); border:1px solid #29323b; }
.scene:before { content:""; position:absolute; inset:30% -60% -100%; transform:perspective(230px) rotateX(55deg); background-image:linear-gradient(#53626b22 1px,transparent 1px),linear-gradient(90deg,#53626b22 1px,transparent 1px); background-size:55px 55px; }
.round { position:absolute; top:20px; left:20px; font:700 11px monospace; letter-spacing:.1em; color:#7c8c98; }
.panel { position:relative; width:calc(100% - 56px); padding:28px; background:#14191ff5; border:1px solid #3a424b; box-sizing:border-box; }
.eyebrow { display:block; color:#87919c; font:700 11px monospace; letter-spacing:.17em; margin-bottom:14px; }
.panel h3 { margin:0 0 28px; font-size:18px; font-weight:500; }
.actions { display:flex; gap:10px; }
.actions button { flex:1; min-height:44px; border:1px solid #48505a; background:transparent; color:#dce2e8; font-size:13px; border-radius:3px; cursor:pointer; }
.actions .confirm { border-color:#9c7273; background:#5d393e; color:#fff1f0; }
.a .panel { border-radius:10px; max-width:340px; }
.a .actions button:first-child { border-color:#9cb8c4; }
.b .panel { width:calc(100% - 32px); padding:22px; border:0; border-left:3px solid #9cc7d8; }
.b h3 { font-size:16px; margin-bottom:22px; }
.b .actions .confirm { background:#d6e3e9; color:#18232b; border-color:#d6e3e9; }
.c .panel { width:calc(100% - 48px); border:0; padding:0; background:#121519f5; }
.c .title { padding:20px 24px; border-bottom:1px solid #ffffff12; font:800 15px monospace; letter-spacing:.1em; }
.c .content { padding:26px 24px 24px; }
.c h3 { font-size:17px; }
.c .actions { flex-direction:column; }
.c .confirm { background:transparent; border-color:#ffffff28; color:#b6bdc5; }
.c button:first-child { background:#d6e3e9; color:#18232b; border:0; }
.description { margin:14px 0 0; color:#9ba4af; font-size:12px; line-height:1.8; }
.note { margin-top:28px; color:#697580; font-size:11px; }
@media(max-width:850px){.options{grid-template-columns:1fr}main{padding:20px}.scene{height:360px}}
</style>
<main>
<header><h1>EXIT UI</h1><span>退出確認 · デザイン候補</span></header>
<div class="options">
<article class="a"><h2><b>A</b>コンパクトカード</h2><div class="scene"><span class="round">ROUND 08</span><section class="panel"><span class="eyebrow">EXIT GAME</span><h3>ゲームから退出しますか？</h3><div class="actions"><button>続ける</button><button class="confirm">退出する</button></div></section></div><p class="description">小さく中央に表示。退出だけを控えめな赤で区別。</p></article>
<article class="b"><h2><b>B</b>フラットバー</h2><div class="scene"><span class="round">ROUND 08</span><section class="panel"><h3>ゲームから退出しますか？</h3><div class="actions"><button>続ける</button><button class="confirm">退出する</button></div></section></div><p class="description">文字とボタンだけ。角を丸めず、淡い青で統一。</p></article>
<article class="c"><h2><b>C</b>インベントリと統一</h2><div class="scene"><span class="round">ROUND 08</span><section class="panel"><div class="title">EXIT</div><div class="content"><h3>ゲームから退出しますか？</h3><div class="actions"><button>ゲームを続ける</button><button class="confirm">退出する</button></div></div></section></div><p class="description">インベントリと同じ暗いパネル。続行ボタンを強調。</p></article>
</div>
<p class="note">背景は比較用のイメージです。退出確認のデザインは選択後に反映します。</p>
</main>
</html>
