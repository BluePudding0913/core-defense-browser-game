<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Pistol sound</title>
<style>body{background:#142027;color:#eef5f4;font:16px system-ui;display:grid;place-content:center;gap:20px;min-height:90vh}button{padding:16px 42px;font:700 18px system-ui;cursor:pointer}label{display:flex;gap:14px;align-items:center}</style>
<button id="play">PISTOL</button><label>VOLUME <input id="volume" type="range" min="0" max="1" step=".01"></label>
<script src="../sound.js"></script><script>
const volume=document.querySelector('#volume');volume.value=coreAudio.getVolume();volume.oninput=()=>coreAudio.setVolume(Number(volume.value));
document.querySelector('#play').onclick=async()=>{await coreAudio.preloadSamples();coreAudio.play('pistol');};
</script></html>
