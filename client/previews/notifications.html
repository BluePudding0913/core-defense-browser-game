<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" href="../style.css">
<style>#preview-controls{position:fixed;bottom:24px;left:24px;display:flex;gap:10px;z-index:5}#preview-controls button{padding:10px 16px;background:#24343b;color:white;border:1px solid #658391;border-radius:4px}#game{background:linear-gradient(#20333f,#101c25)}#hud{display:block}</style>
<canvas id="game"></canvas><section id="hud"><div class="top-bar"><div class="round-status"><strong>ROUND 4</strong><span>02:36</span></div><div id="core-damage-hud" class="core-damage-hud" hidden aria-label="コアの体力"><div class="core-hud-heading"><span>CORE HP</span><span class="core-hud-value"></span></div><div class="core-hud-track"><div class="core-hud-fill"></div></div></div></div></section>
<div id="preview-controls"><button id="hs">HEADSHOT</button><button id="damage">CORE HIT</button><button id="reset">RESET</button></div>
<script src="../combat-feedback.js"></script><script src="../core-feedback.js"></script><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),core={hp:1000,maxHp:1000,x:120,y:120};
document.querySelector('#hs').onclick=()=>CombatFeedback.add({effect:'hit',playerId:'me',enemyId:1,damage:20,headshot:true},performance.now(),'me');
document.querySelector('#damage').onclick=()=>{core.hp=Math.max(0,core.hp-100);CoreFeedback.add(core,performance.now());};
document.querySelector('#reset').onclick=()=>{core.hp=1000;CoreFeedback.reset();CombatFeedback.reset();};
function draw(now){canvas.width=innerWidth;canvas.height=innerHeight;ctx.fillStyle='#fff';ctx.fillRect(innerWidth/2-1,innerHeight/2-1,2,2);CombatFeedback.drawHeadShot(ctx,now,innerWidth/2,innerHeight/2);CoreFeedback.updateHud(document.querySelector('#core-damage-hud'),core,now);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
