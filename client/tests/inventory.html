<!doctype html><html lang="ja"><meta charset="utf-8"><title>Inventory regression</title>
<link rel="stylesheet" href="/client/style.css">
<body><h1>Inventory regression</h1><pre id="result">Running…</pre><div class="inventory-card"><div class="inventory-heading">INVENTORY</div><div id="inventory-items" class="inventory-items"></div></div>
<script src="/client/weapon-ui.js"></script>
<script>
(async () => {
 const output = document.querySelector('#result');
 try {
  const source = await (await fetch('/client/app.js')).text();
  const begin = source.indexOf('function updateInventory(me) {');
  const end = source.indexOf('\nfunction toggleInventory()', begin);
  if (begin < 0 || end < 0) throw new Error('Production inventory code not found');
  const container = document.querySelector('#inventory-items');
  let me = {weapon:'pistol',hp:42,wood:5,ore:3,copper:2,silver:1,medkits:1,down:false,buildItems:{},ownsShotgun:false};
  const sent = [], selected = [];
  let storedOrder = '[]';
  const orderStart = source.indexOf('let equipmentOrder =');
  const orderEnd = source.indexOf('\nfunction selectEquipment', orderStart);
  const weaponDefinitions = {bat:{capacity:0},pistol:{capacity:0},shotgun:{capacity:50,owned:'ownsShotgun',ammo:'shotgunAmmo'}};
  const ordering = new Function('getMe','BUILD_INFO','localStorage','WeaponUI','WEAPON_FIELDS',
    source.slice(orderStart,orderEnd)+'\nreturn {equipmentEntries,reorderEquipment};')(
      ()=>me,{}, {getItem:()=>storedOrder,setItem:(_,value)=>{storedOrder=value;}},WeaponUI,weaponDefinitions);
  const entries = ordering.equipmentEntries;
  const render = new Function('inventoryItems','getMe','equipmentEntries','WEAPON_FIELDS','ammoForWeapon','selectEquipment','send','reorderEquipment','RESOURCE_NAMES',
    source.slice(begin,end)+'\nreturn updateInventory;')(container,()=>me,entries,weaponDefinitions,()=>me.ammo||5,e=>selected.push(e.key),s=>sent.push(s),ordering.reorderEquipment,
      {wood:'木材',ore:'鉄鉱石',copper:'銅',silver:'銀'});
  let checks=0;
  const check=(ok,msg)=>{if(!ok)throw new Error(msg);checks++;};
  render(me);
  check(container.querySelector('.inventory-health').textContent==='HP 42 / 100','Inventory health missing');
  check(container.querySelector('[data-resource="silver"] .resource-count').textContent==='×1','New material missing');
  check(!!container.querySelector('[data-key="item:medkit"]'),'Healing item missing');
  const one=container.querySelector('[data-drop="wood"][data-amount="1"]');
  const all=container.querySelector('[data-drop="wood"][data-amount="all"]');
  one.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
  for(let i=0;i<20;i++){me.ownsShotgun=true;me.ammo=i;render(me);}
  check(one===container.querySelector('[data-drop="wood"][data-amount="1"]'),'Drop button was replaced during a press');
  one.dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));one.click();
  check(sent.at(-1)==='DROP_RESOURCE:wood:1','Single drop lost after snapshots');
  all.focus();me.wood=8;render(me);
  check(document.activeElement===all,'Keyboard focus lost');
  all.click();check(sent.at(-1)==='DROP_RESOURCE:wood:8','Drop all used stale quantity');
  check(sent.length===2,'Duplicate handlers sent multiple commands');
  me.wood=0;render(me);one.click();check(sent.length===2 && one.disabled,'Empty drop enabled');
  me.ore=7;render(me);container.querySelector('[data-drop="ore"][data-amount="all"]').click();
  check(sent.at(-1)==='DROP_RESOURCE:ore:7','Ore drop failed');
  me.down=true;render(me);container.querySelector('[data-drop="ore"][data-amount="all"]').click();
  check(sent.length===3,'Downed player can drop');
  me.down=false;render(me);container.querySelector('[data-key="weapon:shotgun"] strong').click();
  check(selected.at(-1)==='weapon:shotgun','Delegated equipment selection failed');
  const shotgun = container.querySelector('[data-key="weapon:shotgun"]');
  ordering.reorderEquipment('weapon:shotgun','weapon:bat');render(me);
  check(container.querySelector('.equipment-grid').firstElementChild===shotgun,'Reordering must move existing nodes');
  for(let i=0;i<20;i++)render(me);
  check(container.querySelector('.equipment-grid').firstElementChild===shotgun,'Snapshots must preserve reordered nodes');
  container.addEventListener('pointerup',()=>{output.textContent='Order: '+entries(me).map(e=>e.label).join(' → ')+'; selections: '+selected.length;});
  output.textContent='PASS '+checks+' checks: stable press, latest quantities, focus, no duplicate sends, empty/down guards, equipment selection';
 } catch(error){output.textContent='FAIL '+error.stack;}
})();
</script></body></html>
