<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Hacker UI smoke test</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../job-ui.css">
<body><script src="../terminal-ui.js"></script><script>
fetch('../../shared/map.json').then(response => response.json()).then(map => {
    const me = { id: 'test', x: map.missileComputer.x, y: map.missileComputer.y, missileControl: true, missileCooldown: 0 };
    const state = { phase: 'wave', blackoutActive: true, areas: Object.fromEntries(map.areas.map(area => [area.id, true])),
        core: map.core, players: [me], enemies: [{x:1020,y:1500},{x:1200,y:1140},{x:420,y:260}], missiles: [] };
    const options = { map, send(command) {
        if (command === 'COMPUTER') me.missileControl = false;
        if (command.startsWith('MISSILE:')) { const [,x,y] = command.split(':'); state.missiles.push({x:+x,y:+y,radius:120}); me.missileCooldown = 5; }
    }};
    function frame() { window.TerminalUI.update(state, me, options); requestAnimationFrame(frame); }
    frame();
});
</script></body></html>
