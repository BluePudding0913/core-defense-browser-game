<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080d12">
    <title>CORE DEFENSE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game" aria-label="ゲーム画面"></canvas>

    <section id="hud" class="hidden" aria-live="polite">
        <div class="top-bar">
            <div class="round-status">
                <strong id="round">ROUND 0 / 12</strong>
                <span id="phase" class="hidden"></span>
                <span id="phase-detail">next round in 0:20</span>
            </div>
        </div>
        <div id="team" class="team"></div>
        <div id="self-vitals" class="self-vitals hidden">
            <div id="health-heart" class="health-heart" role="img" aria-label="体力 100%">
                <span class="heart-base" aria-hidden="true">♥</span>
                <span class="heart-fill" aria-hidden="true">♥</span>
            </div>
            <div class="credit-balance" aria-label="クレジット">
                <b id="self-credits">700g</b>
            </div>
        </div>
        <div id="notice" class="notice"></div>
        <div id="feedback" class="feedback"></div>
        <div id="build-belt" class="build-belt"></div>
        <div class="controls-right">
            <button id="interact" class="control-button interact hidden" type="button"><span>R</span><small>INTERACT</small></button>
            <button id="weapon" class="control-button weapon" type="button">
                <span id="weapon-icon" class="weapon-icon pistol" aria-hidden="true"></span>
                <span class="weapon-meta">
                    <strong id="weapon-name">PISTOL</strong>
                    <small id="weapon-ammo">∞</small>
                    <span id="weapon-cooldown" class="weapon-cooldown">READY</span>
                </span>
            </button>
        </div>
    </section>

    <div id="round-intro" class="round-intro" aria-live="assertive"></div>

    <section id="action-menu" class="action-menu hidden" aria-modal="true">
        <div class="action-card">
            <div class="action-heading"><strong id="action-title">BUILD</strong><button id="action-close" type="button">×</button></div>
            <div id="action-options" class="action-options"></div>
        </div>
    </section>

    <section id="menu" class="menu">
        <h1>CORE DEFENSE</h1>
        <p id="menu-status">サーバーに接続しています…</p>
        <label>名前 <input id="player-name" maxlength="16" value="Player" autocomplete="nickname"></label>
        <button id="start" type="button" disabled>CPUを補充して防衛開始</button>
        <small>横画面推奨 / PCではWASDでも移動できます</small>
    </section>

    <div id="rotate-message">端末を横向きにしてください</div>
    <script src="app.js"></script>
</body>
</html>
